name: Build for Windows

on:
  workflow_dispatch:
    inputs:
      mailsync_release:
        description: 'Release tag on srenat/Mailspring-Sync holding mailsync-windows.tar.gz'
        required: true
        default: 'phase0-mailsync-ea0b3a9'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Cache NodeJS modules
        uses: actions/cache@v6
        with:
          path: |
            ./node_modules
            ./app/node_modules
          key: windows-2022-deps-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/package-lock.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download Mailsync
        shell: bash
        run: |
          mkdir -p mailsync-prebuilt
          curl -fsSL --retry 3 -o mailsync-prebuilt/mailsync.tar.gz \
            "https://github.com/srenat/Mailspring-Sync/releases/download/${{ inputs.mailsync_release }}/mailsync-windows.tar.gz"
          sha256sum mailsync-prebuilt/mailsync.tar.gz

      - name: Install Dependencies
        run: npm ci
        env:
          MAILSYNC_PREBUILT_DIR: ${{ github.workspace }}\mailsync-prebuilt

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build
        env:
          DEBUG: electron-packager

      - name: Create Windows Installer
        run: node app/build/create-signed-windows-installer.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Mailspring-windows
          path: |
            app/dist/MailspringSetup.exe
            app/dist/*.nupkg
            app/dist/RELEASES
          retention-days: 7
          if-no-files-found: error
