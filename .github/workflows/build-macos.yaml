name: Build for macOS

on:
  workflow_dispatch:
    inputs:
      mailsync_release:
        description: 'Release tag on srenat/Mailspring-Sync holding mailsync-macos.tar.gz'
        required: true
        default: 'phase0-mailsync-ea0b3a9'
  # workflow_dispatch only resolves workflows on the default branch; this push trigger
  # registers the fork's workflow from phase0-spike and runs it when the build inputs change.
  push:
    branches: [phase0-spike]
    paths:
      - '.github/workflows/build-macos.yaml'
      - 'scripts/postinstall.js'

permissions:
  contents: read

env:
  MAILSYNC_RELEASE: ${{ inputs.mailsync_release || 'phase0-mailsync-ea0b3a9' }}

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Cache NodeJS modules
        uses: actions/cache@v6
        with:
          path: |
            ./node_modules
            ./app/node_modules
          key: ${{ matrix.os }}-${{ runner.arch }}-deps-${{ hashFiles('yarn.lock') }}-${{ hashFiles('app/package-lock.json') }}

      - name: Download Mailsync
        run: |
          mkdir -p mailsync-prebuilt
          curl -fsSL --retry 3 -o mailsync-prebuilt/mailsync.tar.gz \
            "https://github.com/srenat/Mailspring-Sync/releases/download/${MAILSYNC_RELEASE}/mailsync-macos.tar.gz"
          shasum -a 256 mailsync-prebuilt/mailsync.tar.gz

      - name: Install Dependencies
        run: npm ci
        env:
          MAILSYNC_PREBUILT_DIR: ${{ github.workspace }}/mailsync-prebuilt

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: DEBUG=electron-packager npm run build

      - name: Rename artifacts
        run: |
          mv app/dist/Mailspring.zip app/dist/Mailspring-macos-${{ matrix.arch }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Mailspring-macos-${{ matrix.arch }}
          path: app/dist/Mailspring-macos-${{ matrix.arch }}.zip
          retention-days: 7
          if-no-files-found: error
